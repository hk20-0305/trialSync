spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "20260802.0013"
    validate-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trialsync}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
trialsync:
  environment: test
  auth-secret: test-secret-that-is-at-least-32-characters-long
  cors-origins: http://localhost:5173,http://127.0.0.1:5173
