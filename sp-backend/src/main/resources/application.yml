# TrialSync backend configuration.
#
# Every value below mirrors the Python `trialsync.config.Settings` contract so the
# migrated service reads the same environment variables as the original backend.
# Secrets are never committed: supply them through the environment or a local .env.
spring:
  application:
    name: TrialSync API
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: trialsync-pool
      maximum-pool-size: ${DATABASE_POOL_SIZE}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # baseline-version="0" ensures that ALL migrations (including V20260802_0012
    # which creates the full schema and V20260802_0013 which seeds the 25 clinical
    # concepts) are applied on a completely fresh / empty PostgreSQL database.
    # All migrations use IF NOT EXISTS / ON CONFLICT DO NOTHING guards so they are
    # fully idempotent on databases that already have the schema in place.
    baseline-version: "0"
    # validate-on-migrate=false suppresses spurious warnings for the PostgreSQL 18
    # version that is newer than the Flyway release bundled here.
    validate-on-migrate: false
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

server:
  port: ${PORT:8000}
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs

logging:
  level:
    root: INFO
    com.trialsync: INFO

trialsync:
  app-name: TrialSync API
  environment: ${TRIALSYNC_ENVIRONMENT:development}
  debug: ${TRIALSYNC_DEBUG:false}
  auth-secret: ${TRIALSYNC_AUTH_SECRET:}
  access-token-minutes: ${TRIALSYNC_ACCESS_TOKEN_MINUTES:480}
  cors-origins: ${TRIALSYNC_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  screening-batch-max-patients: ${TRIALSYNC_SCREENING_BATCH_MAX_PATIENTS:50}
  screening-batch-max-trials: ${TRIALSYNC_SCREENING_BATCH_MAX_TRIALS:10}
  screening-batch-max-pairs: ${TRIALSYNC_SCREENING_BATCH_MAX_PAIRS:500}
  groq-api-key: ${GROQ_API_KEY:}
  groq-model: ${TRIALSYNC_GROQ_MODEL:openai/gpt-oss-20b}
  extraction-provider: ${TRIALSYNC_EXTRACTION_PROVIDER:groq}
  screening-chat-provider: ${TRIALSYNC_SCREENING_CHAT_PROVIDER:auto}
  provider-timeout-seconds: ${TRIALSYNC_PROVIDER_TIMEOUT_SECONDS:12.0}
  provider-max-retries: ${TRIALSYNC_PROVIDER_MAX_RETRIES:1}
  provider-max-input-chars: ${TRIALSYNC_PROVIDER_MAX_INPUT_CHARS:100000}
  screening-chat-message-max-chars: ${TRIALSYNC_SCREENING_CHAT_MESSAGE_MAX_CHARS:1000}
  screening-chat-max-messages: ${TRIALSYNC_SCREENING_CHAT_MAX_MESSAGES:10}
  screening-chat-max-answer-chars: ${TRIALSYNC_SCREENING_CHAT_MAX_ANSWER_CHARS:2000}
  terminology-suggestions-enabled: ${TRIALSYNC_TERMINOLOGY_SUGGESTIONS_ENABLED:true}
  terminology-timeout-seconds: ${TRIALSYNC_TERMINOLOGY_TIMEOUT_SECONDS:5.0}
  terminology-max-results: ${TRIALSYNC_TERMINOLOGY_MAX_RESULTS:5}
  loinc-username: ${TRIALSYNC_LOINC_USERNAME:}
  loinc-password: ${TRIALSYNC_LOINC_PASSWORD:}
  research:
    rag:
      provider: ${TRIALSYNC_ELIGIBILITY_RAG_PROVIDER:gemini}
      gemini-api-key: ${GEMINI_API_KEY:}
      gemini-model: ${TRIALSYNC_GEMINI_MODEL:gemini-1.5-flash}
      timeout-seconds: ${TRIALSYNC_RAG_TIMEOUT_SECONDS:15.0}
      top-k: ${TRIALSYNC_RAG_TOP_K:5}


